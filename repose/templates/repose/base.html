{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="author" content="Fanny Henriques">

  <meta name="description"
    content="{% block meta_description %}Repose Spa & Wellness offers relaxing spa experiences, treatments and wellness memberships.{% endblock %}">

  <meta name="keywords" content="spa, wellness, massage, treatments, spa membership, relaxation">

  <title>{% block title %}Repose Spa & Wellness{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'repose/css/style.css' %}">

  {% block extra_css %}
  {% endblock %}
</head>

<body>
  <header>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'about' %}">About Us</a>
      <a href="{% url 'treatments' %}">Treatments</a>
      <a href="{% url 'packages' %}">Packages</a>
      <a href="{% url 'membership' %}">Membership</a>
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}">Register</a>
      <a href="{% url 'booking' %}">Book Now</a>
    </nav>
  </header>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <footer>
    <p>&copy; Repose Spa & Wellness</p>
  </footer>

  {% block extra_js %}
  {% endblock %}
</body>

</html>
